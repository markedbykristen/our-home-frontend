<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0ED"/>
      <stop offset="100%" style="stop-color:#F2D7D7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- gothic cross -->
  <!-- vertical beam -->
  <path d="M256 100 L272 115 L272 390 Q272 410 256 420 Q240 410 240 390 L240 115 Z" fill="#B07878"/>
  <!-- horizontal beam -->
  <path d="M148 210 L163 194 L349 194 L364 210 L349 226 L163 226 Z" fill="#B07878"/>
  
  <!-- gothic pointed tips -->
  <!-- top point -->
  <path d="M244 100 L256 72 L268 100 Z" fill="#B07878"/>
  <!-- bottom point -->
  <path d="M244 390 L256 430 L268 390" fill="#B07878"/>
  <!-- left point -->
  <path d="M148 198 L128 210 L148 222 Z" fill="#B07878"/>
  <!-- right point -->
  <path d="M364 198 L384 210 L364 222 Z" fill="#B07878"/>
  
  <!-- circle at center -->
  <circle cx="256" cy="210" r="24" fill="none" stroke="#B07878" stroke-width="4" opacity="0.6"/>
  
  <!-- small ornamental dots -->
  <circle cx="256" cy="210" r="6" fill="#D4A0A0"/>
  <circle cx="256" cy="150" r="4" fill="#D4A0A0" opacity="0.5"/>
  <circle cx="256" cy="270" r="4" fill="#D4A0A0" opacity="0.5"/>
  <circle cx="196" cy="210" r="4" fill="#D4A0A0" opacity="0.5"/>
  <circle cx="316" cy="210" r="4" fill="#D4A0A0" opacity="0.5"/>
  
  <!-- tiny stars -->
  <path d="M180 130 l4 12 12 0-10 7 4 12-10-8-10 8 4-12-10-7 12 0z" fill="#D4A0A0" opacity="0.3"/>
  <path d="M340 320 l4 12 12 0-10 7 4 12-10-8-10 8 4-12-10-7 12 0z" fill="#D4A0A0" opacity="0.3"/>
</svg>
